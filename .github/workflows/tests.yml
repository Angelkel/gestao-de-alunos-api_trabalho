name: Testes de API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Iniciar API
        run: |
          npm start > api.log 2>&1 &
          echo $! > api.pid
          echo "API iniciada com PID $(cat api.pid)"

      - name: Aguardar API
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              echo "API está disponível."
              exit 0
            fi

            echo "Aguardando API..."
            sleep 2
          done

          echo "A API não iniciou corretamente."
          echo "Logs da API:"
          cat api.log
          exit 1

      - name: Executar testes
        run: npm test
        env:
          BASE_URL: http://127.0.0.1:3000
          MONGODB_URI: mongodb://127.0.0.1:27017/gestao-de-alunos-test
          PORT: 3000
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_SENHA: ${{ secrets.ADMIN_SENHA }}
          ALUNO_EMAIL: ${{ secrets.ALUNO_EMAIL }}
          ALUNO_SENHA: ${{ secrets.ALUNO_SENHA }}

      - name: Encerrar API
        if: always()
        run: |
          echo "Encerrando API..."

          if [ -f api.pid ]; then
            kill "$(cat api.pid)" 2>/dev/null || true
            echo "API encerrada."
          else
            echo "PID da API não encontrado."
          fi

          sleep 2